name: Java Tests

on:
  push:
    branches:
      - main
      - master
      - feat/booking-recovery-and-demo
  pull_request:

jobs:
  unit-tests:
    name: Unit and Spring Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: conference_test
          MYSQL_USER: conference_user
          MYSQL_PASSWORD: change_me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/conference_test
      TEST_DB_USER: conference_user
      TEST_DB_PASSWORD: change_me
      DEMO_PASSWORD: ci_demo_password_2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit and Spring tests
        run: mvn -B clean test