##################################
# SERWER
##################################
server.port=8081
server.error.whitelabel.enabled=true
server.error.path=/error
#server.servlet.session.timeout=1800

##################################
# FORMATOWANIE DAT
##################################
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ssXXX

##################################
# BAZA DANYCH
##################################
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/conference}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

##################################
# JPA & HIBERNATE
##################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

##################################
# FLYWAY (wy??czony)
##################################
spring.flyway.enabled=false
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/conference}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.schemas=conference
spring.flyway.validate-on-migrate=false

##################################
# OAUTH2 ? LOGOWANIE U?YTKOWNIKĂ“W (Delegated Permissions)
##################################
spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.azure.scope=openid, profile, email, offline_access, User.Read, Calendars.ReadWrite

spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.azure.client-name=Azure

spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys

##################################
# CLIENT CREDENTIALS FLOW ? TokenService (Application Permissions)
##################################
azure.client-id=${AZURE_CLIENT_ID}
azure.client-secret=${AZURE_CLIENT_SECRET}
azure.tenant-id=${AZURE_TENANT_ID}
azure.graph.scope=https://graph.microsoft.com/.default

